[package]
name = "tvert-editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Post-capture editor for Tvert"
license.workspace = true

[dependencies]
tvert-image.workspace = true

iced = { workspace = true, features = [
  "advanced",
  "canvas",
  "image-without-codecs",
  "thread-pool",
  "tiny-skia",
  "wayland",
] }
iced_aw = { workspace = true, features = ["drop_down"] }
lucide-icons.workspace = true
num-traits.workspace = true
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
claims.workspace = true
rstest.workspace = true

[lints]
workspace = true
