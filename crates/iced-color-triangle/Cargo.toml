[package]
name = "iced-color-triangle"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A hue ring and triangle color selector for Iced"
license.workspace = true
readme = "README.md"
keywords = ["iced", "color", "picker", "widget"]
categories = ["gui"]

[dependencies]
iced_core = "0.14"
iced_widget = { version = "0.14", default-features = false, features = [
  "canvas",
] }
palette = { version = "0.7", default-features = false, features = ["std"] }

[dev-dependencies]
claims.workspace = true
iced = { workspace = true, default-features = false, features = [
  "canvas",
  "tiny-skia",
  "thread-pool",
  "wayland",
] }
iced_tiny_skia = { version = "0.14", default-features = false, features = [
  "geometry",
] }
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[lints]
workspace = true
