[workspace]
resolver = "3"
members = [".", "crates/*"]
default-members = ["crates/tvert-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kristofers Solo <dev@kristofers.xyz>"]
description = "A Wayland-native screenshot tool for Linux, built in Rust"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tvert-cli = { path = "crates/tvert-cli" }
tvert-editor = { path = "crates/tvert-editor" }
tvert-image = { path = "crates/tvert-image" }
tvert-wayland = { path = "crates/tvert-wayland" }
tvert-workflow = { path = "crates/tvert-workflow" }

clap = { version = "4.6" }
color-eyre = "0.6"
iced = { version = "0.14", default-features = false, features = [
  "advanced",
  "canvas",
  "image-without-codecs",
  "thread-pool",
  "tiny-skia",
  "wayland",
] }
lucide-icons = "1.53"
png = "0.18"
rustix = { version = "1", features = ["fs"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
wl-clipboard-rs = "0.9"

wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = [
  "client",
  "staging",
  "unstable",
] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# dev dependencies
claims = "0.8"
rstest = "0.27"
tempfile = "3"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
