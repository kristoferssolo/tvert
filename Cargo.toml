[workspace]
resolver = "3"
members = [".", "crates/*"]
default-members = ["crates/tvert-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kristofers Solo <dev@kristofers.xyz>"]
description = "A Wayland-native screenshot tool for Linux, built in Rust"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tvert-cli = { path = "crates/tvert-cli" }
tvert-editor = { path = "crates/tvert-editor" }
tvert-image = { path = "crates/tvert-image" }
tvert-wayland = { path = "crates/tvert-wayland" }
tvert-workflow = { path = "crates/tvert-workflow" }

clap = "4.6"
iced = { version = "0.14", default-features = false }
iced-color-triangle = "0.1"
iced_aw = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false }
jiff = "0.2"
lucide-icons = "1.53"
miette = { version = "7.6", default-features = false }
num-traits = "0.2"
png = "0.18"
rustix = "1"
serde = "1"
serde_path_to_error = "0.1"
strum = "0.28"
thiserror = "2"
toml = { version = "1.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
wl-clipboard-rs = "0.9"

wayland-client = "0.31"
wayland-protocols = "0.32"
wayland-protocols-wlr = "0.3"

# dev dependencies
claims = "0.8"
rstest = "0.27"
tempfile = "3"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
