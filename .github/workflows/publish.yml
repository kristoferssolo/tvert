name: Publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version number in the format v1.2.3
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  metadata:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Resolve and validate release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              version="${INPUT_VERSION#v}"
          else
              version="${REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be a valid SemVer value in the format v1.2.3"
              exit 1
          fi

          manifest_version="$(
              cargo metadata --no-deps --format-version 1 |
                  jq -r '.packages[] | select(.name == "tvert-cli") | .version'
          )"
          if [[ "$manifest_version" != "$version" ]]; then
              echo "::error::tvert-cli is version $manifest_version, not $version"
              exit 1
          fi

          {
              echo "tag=v$version"
              echo "version=$version"
          } >>"$GITHUB_OUTPUT"
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  build-binaries:
    name: Build tvert (${{ matrix.target }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain and target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Build release binary
        run: cargo build --locked --release --package tvert-cli --bin tvert --target ${{ matrix.target }}
      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          archive="tvert-$VERSION-$TARGET"
          mkdir -p "dist/$archive"
          install -m 0755 "target/$TARGET/release/tvert" "dist/$archive/tvert"
          cp LICENSE-APACHE LICENSE-MIT README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          (
              cd dist
              sha256sum "$archive.tar.gz" >"$archive.tar.gz.sha256"
          )
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: tvert-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  release:
    name: Create GitHub release
    needs:
      - metadata
      - audit
      - build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.14
          install_args: --locked git-cliff
      - name: Generate release notes
        env:
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          # A manual run can release a tag that does not exist yet
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
              git checkout --quiet --detach "$TAG"
              git cliff --current --strip all --output "$NOTES_PATH"
          else
              git cliff --unreleased --tag "$TAG" --strip all --output "$NOTES_PATH"
          fi
      - name: Download tvert binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: tvert-*
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: tvert v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
