[save]
# strftime pattern for saved PNGs. A leading ~/ is the home directory,
# relative paths start in the working directory, and %% is a literal %.
# Dated folders: "~/Pictures/Screenshots/%Y/%m/tvert-%Y-%m-%d_%H-%M-%S.png"
path = "~/Pictures/tvert-%Y-%m-%d_%H-%M-%S.png"

[editor]
theme = "dark"
tool = "arrow"
stroke_color = "#FF4040"
stroke_width = 4
pixelation_block_size = 16
blur_sigma = 8
