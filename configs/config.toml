[capture]
# Output to capture, such as "DP-1", or "all" to choose a monitor.
# Desktop capture always includes all outputs.
# Region selection cannot span several outputs yet; on multi-monitor
# setups, region capture requires an output name.
output = "all"

[save]
# strftime pattern for saved PNGs. A leading ~/ is the home directory,
# relative paths start in the working directory, and %% is a literal %.
# Dated folders: "~/Pictures/Screenshots/%Y/%m/tvert-%Y-%m-%d_%H-%M-%S.png"
path = "~/Pictures/tvert-%Y-%m-%d_%H-%M-%S.png"

[editor]
theme = "dark"
tool = "arrow"
stroke_color = "#FF4040"
stroke_width = 4
pixelation_block_size = 16
blur_sigma = 8
